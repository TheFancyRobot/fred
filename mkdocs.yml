site_name: Fred Documentation
site_description: A flexible framework for building AI agents with intent-based routing
site_author: Fred Framework
site_url: https://TheFancyRobot.github.io/fred

repo_name: fred
repo_url: https://github.com/TheFancyRobot/fred
edit_uri: edit/main/docs/

exclude_docs: |
  README.md
  advanced/**
  api-reference/**
  examples/**
  getting-started/**
  guides/**
  idea_refinement/**
  migration/*.patch
  migration/v0.2.5.md
  plans/**
  requirements.txt
  superpowers/**

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # scripts/docs.ts runs MkDocs from the repository root so the published
      # migration page can include the canonical root MIGRATION.md verbatim.
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Current release: index.md
  - Phase 68 migration: migration/v0.4.0.md
  - Provider connections: provider-connections.md
  - PostgreSQL operations: postgres.md
  - Credential security: credential-security.md
  - Phase 70 migration: migration/v3.0.0-provider-connections.md
  - Struct provider-connection handoff: struct-provider-connections-handoff.md
  - Package documentation: https://github.com/TheFancyRobot/fred#packages
  - Release runbook: https://github.com/TheFancyRobot/fred/blob/main/RELEASE.md

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      exclude:
        - idea_refinement/**
        - plans/**
