name: Security

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 120 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo 'ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tar.gz' | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan pull request commits
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            timeout 120s git fetch --no-tags origin "$GITHUB_BASE_REF" --depth=1
            ./gitleaks detect --source . --log-opts="origin/$GITHUB_BASE_REF..HEAD" --redact --no-banner
          else
            ./gitleaks detect --source . --no-git --redact --no-banner
          fi

  semgrep:
    name: SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run semgrep
        run: semgrep scan --config auto --severity ERROR --error --json --output semgrep-results.json .
      - name: Upload semgrep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run high severity audit
        run: bun audit --audit-level=high
