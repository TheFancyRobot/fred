providers:
  - id: openai
    modelDefaults:
      model: gpt-4o-mini
      temperature: 0.7

agents:
  - id: assistant
    systemMessage: "You are a helpful assistant."
    platform: openai
    model: gpt-4o-mini
  - id: coder
    systemMessage: "You are a coding assistant. Help with code questions."
    platform: openai
    model: gpt-4o-mini

intents:
  - id: code-intent
    utterances: ["code", "programming", "function", "bug"]
    action:
      type: agent
      target: coder

routing:
  defaultAgent: assistant
  rules: []
